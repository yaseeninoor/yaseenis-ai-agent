name: FM Store Source Index
on:
  push:
    branches: [main, master]
    paths:
      - 'FM-STORE-SETUP/source-files/**'
      - 'FM-STORE-SETUP/scripts/**'
      - 'FM-STORE-SETUP/.github/workflows/index-source-files.yml'
  workflow_dispatch:
jobs:
  index:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests openpyxl pypdf python-docx
      - name: Index FM Store files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          REPO: ${{ github.repository }}
          REF: ${{ github.sha }}
        run: python FM-STORE-SETUP/scripts/index_github_files.py
